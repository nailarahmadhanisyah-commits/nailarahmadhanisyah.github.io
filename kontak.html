        <title>Kontak</title>

        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">

        <style>
            :root {
                --pink: #ff36a2;
                --blue: #45d7ff;
                --yellow: #faff4d;
                --purple: #a98bff;
                --black: #171522;
                --white: #fffdf5;
            }

            * {
                box-sizing: border-box;
            }

            html {
                scroll-behavior: smooth;
            }

            body {
                margin: 0;
                padding: 35px 16px;
                color: var(--black);
                font-family: "Space Grotesk", Arial, sans-serif;
                background-color: #b5a4ff;
                background-image:
                    radial-gradient(circle, #171522 1.5px, transparent 1.5px);
                background-size: 19px 19px;
            }

            body > p {
                display: none;
            }

            table {
                width: 100%;
                max-width: 1050px;
                margin: auto;
                background: var(--white);
                border: 4px solid var(--black);
                border-collapse: separate;
                border-spacing: 0;
                border-radius: 20px;
                box-shadow: 10px 10px 0 var(--black);
                overflow: hidden;
            }

            td {
                padding: 22px;
                border: none;
            }

            tr:first-child td {
                color: var(--white);
                background-color: var(--pink);
                background-image:
                    radial-gradient(circle, rgba(255,255,255,.28) 2px, transparent 2px) !important;
                background-size: 22px 22px;
                border-bottom: 4px solid var(--black);
                text-align: center;
            }

            tr:first-child h1 {
                margin: 17px 0 5px;
                font-family: "Archivo Black", Impact, sans-serif;
                font-size: clamp(38px, 7vw, 70px);
                line-height: 1.1;
                letter-spacing: -2px;
                text-transform: uppercase;
                -webkit-text-stroke: 1px var(--black);
                text-shadow:
                    4px 4px 0 var(--black),
                    8px 8px 0 var(--blue);
            }

            tr:first-child em {
                display: inline-block;
                margin-top: 10px;
                padding: 8px 14px;
                color: var(--black);
                background: var(--white);
                border: 3px solid var(--black);
                border-radius: 8px;
                box-shadow: 4px 4px 0 var(--black);
                font-size: 13px;
                font-weight: 700;
                font-style: normal;
            }

            tr:nth-child(2) td {
                padding: 17px;
                background: var(--blue);
                border-bottom: 4px solid var(--black);
                text-align: center;
            }

            tr:nth-child(2) a {
                display: inline-block;
                margin: 5px 3px;
                padding: 10px 16px;
                color: var(--black);
                background: var(--white);
                border: 3px solid var(--black);
                border-radius: 7px;
                box-shadow: 4px 4px 0 var(--black);
                font-size: 12px;
                font-weight: 700;
                text-decoration: none;
                transition: .2s ease;
            }

            tr:nth-child(2) a:hover {
                color: var(--white);
                background: var(--pink);
                transform: translate(3px, 3px);
                box-shadow: 1px 1px 0 var(--black);
            }

            tr:nth-child(3) td {
                padding: 35px 28px;
                background: var(--white);
                text-align: center;
            }

            tr:nth-child(3) h2 {
                margin: 0 0 22px;
                padding-bottom: 15px;
                border-bottom: 4px solid var(--black);
                font-family: "Archivo Black", sans-serif;
                font-size: clamp(21px, 4vw, 29px);
                line-height: 1.4;
                text-transform: uppercase;
            }

            tr:nth-child(3) p {
                margin: 15px 0;
                padding: 15px;
                background: #fff0f8;
                border: 3px solid var(--black);
                border-radius: 10px;
                box-shadow: 5px 5px 0 var(--black);
                font-size: 14px;
                line-height: 1.8;
                overflow-wrap: anywhere;
            }

            tr:nth-child(3) a {
                color: var(--black);
                font-weight: 700;
                text-decoration: underline;
                text-decoration-color: var(--pink);
                text-decoration-thickness: 2px;
            }

            tr:nth-child(3) a:hover {
                color: var(--pink);
            }

            tr:nth-child(3) hr {
                height: 4px;
                margin-top: 25px;
                background: var(--yellow);
                border: 2px solid var(--black);
            }

            @media (max-width: 720px) {
                body {
                    padding: 16px 10px;
                }

                table {
                    box-shadow: 6px 6px 0 var(--black);
                }

                td {
                    padding: 16px;
                }

                tr:first-child h1 {
                    font-size: 36px;
                    letter-spacing: -1px;
                }

                tr:nth-child(2) td {
                    padding: 13px 8px;
                }

                tr:nth-child(2) a {
                    margin: 4px 2px;
                    padding: 9px 10px;
                    font-size: 11px;
                }

                tr:nth-child(3) td {
                    padding: 25px 15px;
                }

                tr:nth-child(3) h2 {
                    font-size: 21px;
                }
            }
        </style>
    </head>
